version: "3.9"
networks:
  my-network:

services:
  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - rabbitmq
    networks:
      - my-network
    environment:
      - DATABASE_URL=postgres://postgres:Holly_2000@db:5432/todoapp
      - DJANGO_SETTINGS_MODULE=config.settings
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672// # Не используйте guest:guest в production
      - EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
      - EMAIL_HOST=smtp.gmail.com # Ваш почтовый сервер
      - EMAIL_PORT=587 # Ваш порт
      - EMAIL_HOST_USER=myyardverify@gmail.com # Ваше имя пользователя
      - EMAIL_HOST_PASSWORD=jrfg gysj kxqa kven # Ваш пароль
      - EMAIL_USE_TLS=True

  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Holly_2000
      - POSTGRES_DB=todoapp
    ports:
      - "5432:5432" # Уберите, если не нужен внешний доступ к базе
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my-network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    networks:
      - my-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672" # Management UI
      - "5672:5672"
    networks:
      - my-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - my-network

volumes:
  postgres_data: