   version: "3.9"
   networks:
     my-network:

   services:
     web:
       build: .
       ports:
         - "8000:8000"
       depends_on:
         - db
       networks:
         - my-network
       environment:
         - DATABASE_URL=postgres://postgres:Holly_2000@db:5432/todoapp
         - DJANGO_SETTINGS_MODULE=config.settings

     db:
       image: postgres:17
       environment:
         - POSTGRES_USER=postgres
         - POSTGRES_PASSWORD=Holly_2000
         - POSTGRES_DB=todoapp
       ports:
         - "5432:5432" #Или уберите, если не нужен внешний доступ к базе
       volumes:
         - postgres_data:/var/lib/postgresql/data
       networks:
         - my-network

     nginx:
       image: nginx:latest
       ports:
         - "80:80"
       volumes:
         - ./nginx.conf:/etc/nginx/conf.d/default.conf
       depends_on:
         - web
       networks:
         - my-network

   volumes:
     postgres_data:
   