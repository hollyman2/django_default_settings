server {
    listen 80;
    listen [::]:80;
    server_name 127.0.0.1; # Замените на ваше доменное имя или IP-адрес

    location /static {
        alias /project/static; # Путь к статическим файлам в контейнере
        expires 30d;
    }

    location / {
        proxy_pass http://web:8000; # <--- ИЗМЕНЕНО: django:8000 на web:8000
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ... HTTPS конфигурация (необязательно) ...
}
