[supervisord]
nodaemon=true

[program:gunicorn]
command=/app/.venv/bin/gunicorn config.wsgi:application --bind 0.0.0.0:8000
autostart=true
autorestart=true
user=appuser
redirect_stderr=true

[program:celeryworker]
command=/app/.venv/bin/celery -A config.celery worker -l info -c 4
autostart=true
autorestart=true
user=appuser
redirect_stderr=true

[program:celerybeat]
command=/app/.venv/bin/celery -A config.celery beat -l info
autostart=true
autorestart=true
user=appuser
redirect_stderr=true